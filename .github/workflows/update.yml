name: Update Stroomtip

on:
  schedule:
  - cron: '7 12 * * *'    # 14:07 lokale tijd tijdens zomertijd
  - cron: '7 13 * * *'    # 14:07 lokale tijd tijdens wintertijd
  - cron: '7 14 * * *'    # 16:07 lokale tijd tijdens zomertijd
  - cron: '7 15 * * *'    # 16:07 lokale tijd tijdens wintertijd
  - cron: '37 17 * * *'   # extra vangnet, later op de dag
  - cron: '37 18 * * *'   # extra vangnet, later op de dag (wintertijd-equivalent)
workflow_dispatch:        # ook manueel te starten via de Actions-pagina

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Packages installeren
        run: pip install requests

      - name: Dashboard genereren
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python3 epex_dashboard.py

      - name: Pushen naar GitHub
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add index.html
          git diff --cached --quiet || git commit -m "stroomtip update $(date '+%Y-%m-%d %H:%M')"
          git push
